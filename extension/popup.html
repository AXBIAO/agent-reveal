<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Agent Reveal</title>
<style>
  body { width: 280px; margin: 0; padding: 16px; background: #18181b; color: #e4e4e7;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { margin: 0 0 12px; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .row label { color: #a1a1aa; }
  input[type=range] { width: 130px; accent-color: #2f7bff; }
  input[type=checkbox] { accent-color: #2f7bff; width: 16px; height: 16px; }
  output { color: #fff; min-width: 30px; text-align: right; display: inline-block; }
  button { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 9px;
    background: #2f7bff; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 10px; min-height: 18px; color: #fca5a5; }
  .seg { display: flex; background: #27272a; border-radius: 8px; padding: 2px; }
  .seg input { display: none; }
  .seg label { padding: 4px 12px; border-radius: 6px; color: #a1a1aa; cursor: pointer; }
  .seg input:checked + label { background: #2f7bff; color: #fff; }
  #viewHint { margin: -4px 0 6px; color: #71717a; font-size: 12px; min-height: 16px; }
  .hint { margin-top: 8px; color: #71717a; font-size: 12px; }
</style>
</head>
<body>
  <h1><img src="icons/32.png" alt="">Agent Reveal</h1>
  <div class="row"><span style="color:#a1a1aa">视图</span>
    <div class="seg" role="radiogroup">
      <input type="radio" name="view" id="viewDesktop" value="desktop"><label for="viewDesktop">💻 电脑</label>
      <input type="radio" name="view" id="viewMobile" value="mobile"><label for="viewMobile">📱 手机</label>
    </div></div>
  <div id="viewHint"></div>
  <div class="row"><label for="record">自动录屏</label><input id="record" type="checkbox"></div>
  <div class="row"><label for="sound">声音</label><input id="sound" type="checkbox"></div>
  <div class="row"><label for="rulers">标尺与参考线</label><input id="rulers" type="checkbox"></div>
  <div class="row"><label for="autoScroll" title="关闭后只搭当前屏幕，你往下滚到哪里就搭到哪里">自动向下滚动</label><input id="autoScroll" type="checkbox"></div>
  <div class="row"><label for="maxAgents">光标上限</label>
    <span><input id="maxAgents" type="range" min="4" max="40" step="1"> <output id="maxAgentsOut"></output></span></div>
  <div class="row"><label for="speed" title="越大越快">动作速度</label>
    <span><input id="speed" type="range" min="0.5" max="2" step="0.1"> <output id="speedOut"></output></span></div>
  <div class="row"><label for="showNames">显示 Agent 名字</label><input id="showNames" type="checkbox"></div>
  <button id="start">▶ 开始</button>
  <div id="status"></div>
  <div class="hint">快捷键 Alt+Shift+R 按上次设置直接开始 · 播放中按 Esc 退出</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
